[package]
name = "cw-ffi"
description = "coverwave's shared core for native apps (iOS), via UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "cw_ffi"

[[bin]]
# Generates the Swift bindings: see ios/build-core.sh.
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
cw-analysis.workspace = true
cw-core.workspace = true
cw-render.workspace = true
serde_json = "1.0.154"
thiserror = "2.0.21"
uniffi = "0.32.2"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
