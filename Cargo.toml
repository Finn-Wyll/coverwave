[workspace]
resolver = "3"
members = ["crates/cw-audio","crates/cw-core", "crates/cw-render", "frontends/cw-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Finn-Wyll/coverwave"

[workspace.dependencies]
cw-core = { path = "crates/cw-core" }
cw-render = { path = "crates/cw-render" }
cw-audio = { path = "crates/cw-audio" }

[profile.release]
lto = "thin"
