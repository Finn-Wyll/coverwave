[workspace]
resolver = "3"
members = [
    "crates/cw-analysis",
    "crates/cw-audio",
    "crates/cw-capture",
    "crates/cw-core",
    "crates/cw-ffi",
    "crates/cw-library",
    "crates/cw-render",
    "crates/cw-sources",
    "frontends/cw-tui",
    "tools/pca-fit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Finn-Wyll/coverwave"

[workspace.dependencies]
cw-analysis = { path = "crates/cw-analysis" }
cw-core = { path = "crates/cw-core" }
cw-library = { path = "crates/cw-library" }
cw-render = { path = "crates/cw-render" }
cw-audio = { path = "crates/cw-audio" }
cw-capture = { path = "crates/cw-capture" }
cw-sources = { path = "crates/cw-sources" }

# Debug builds keep line numbers for this project's code (panics and test
# failures still point at the right line) and no debug info for
# dependencies. Full debug info made target/debug about 12 GB, mostly tract.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
