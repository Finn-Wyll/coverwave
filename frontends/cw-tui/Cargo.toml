[package]
name = "cw-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.105"
cw-analysis.workspace = true
cw-audio.workspace = true
cw-capture.workspace = true
cw-core.workspace = true
cw-library.workspace = true
cw-render.workspace = true
cw-sources.workspace = true
ratatui = "0.30.2"
rtrb = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
toml = "1"
ureq = { version = "3.5", features = ["platform-verifier"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
