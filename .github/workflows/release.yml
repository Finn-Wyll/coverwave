# Builds everything heavy on GitHub and publishes it as the rolling
# "latest-build" pre-release, so a Mac does not need a 16 GB Rust build
# folder to run coverwave:
#
#   - CoverwaveCore.xcframework.zip + CoverwaveCore.swift: the iOS Rust core
#     and its Swift bindings (ios/build-core.sh). ios/fetch-core.sh
#     downloads them; Xcode then only compiles the Swift app and signs it.
#   - BeatThis-small.onnx: the beat tracker (ios/tools/export_beat_model.py).
#   - the coverwave terminal app for macOS (Apple silicon), Linux and Windows.
#   - build-info.txt: the commit they were built from.
#
# Runs on every push to main that touches code, and by hand (Actions >
# Release > Run workflow). Pushes only build while the repo is PUBLIC, where
# Actions minutes are free; on a private repo only manual runs build (they
# use the account's minutes, macOS counting 10x).
#
# Pushing a version tag (`git tag v0.2.0 && git push origin v0.2.0`) also
# publishes a proper release named after it, with the same files, marked as
# the latest release. Every release gets download notes, labelled files and
# SHA256SUMS.txt.
name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"

concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ios-core:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-core
      - name: Build the core
        run: ios/build-core.sh
      - name: Package
        run: |
          mkdir -p out
          (cd ios/Frameworks && zip -qry ../../out/CoverwaveCore.xcframework.zip CoverwaveCore.xcframework)
          cp ios/Coverwave/Generated/CoverwaveCore.swift out/
      - uses: actions/upload-artifact@v4
        with:
          name: ios-core
          path: out/*
          if-no-files-found: error
          retention-days: 3

  beat-model:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cached model
        id: cache
        uses: actions/cache@v4
        with:
          path: out/BeatThis-small.onnx
          key: beat-model-${{ hashFiles('ios/tools/export_beat_model.py') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
      - name: Export Beat This! small0 (MIT) to ONNX
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet onnx onnxruntime onnxscript einops soxr rotary-embedding-torch \
            numpy soundfile tqdm "git+https://github.com/CPJKU/beat_this.git"
          python ios/tools/export_beat_model.py out/BeatThis-small.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: beat-model
          path: out/BeatThis-small.onnx
          if-no-files-found: error
          retention-days: 3

  tui:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tui
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Build
        run: cargo build --release -p cw-tui
      - name: Package
        shell: bash
        run: |
          mkdir -p out pkg
          cp LICENSE pkg/
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/coverwave.exe pkg/
            (cd pkg && 7z a -bso0 "../out/coverwave-${{ matrix.name }}.zip" .)
          else
            cp target/release/coverwave pkg/
            tar -czf "out/coverwave-${{ matrix.name }}.tar.gz" -C pkg .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [ios-core, beat-model, tui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          sha="${GITHUB_SHA::7}"
          printf 'commit %s\nbuilt %s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%MZ)" > dist/build-info.txt
          (cd dist && sha256sum * > SHA256SUMS.txt)
          size() { du -h "dist/$1" | cut -f1; }
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          {
            if [ "$RELEASE_TAG" = latest-build ]; then
              echo "The newest build of \`main\` (commit [\`$sha\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})), rebuilt on every push. For a fixed version, pick a \`v\` release."
            else
              echo "coverwave ${RELEASE_TAG}, built from commit [\`$sha\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            fi
            echo
            echo "### Terminal app"
            echo
            echo "| System | Download | Size |"
            echo "|---|---|---|"
            echo "| macOS, Apple silicon | [coverwave-macos-arm64.tar.gz]($base/coverwave-macos-arm64.tar.gz) | $(size coverwave-macos-arm64.tar.gz) |"
            echo "| Linux, x86-64 | [coverwave-linux-x64.tar.gz]($base/coverwave-linux-x64.tar.gz) | $(size coverwave-linux-x64.tar.gz) |"
            echo "| Windows, x86-64 | [coverwave-windows-x64.zip]($base/coverwave-windows-x64.zip) | $(size coverwave-windows-x64.zip) |"
            echo
            echo "macOS and Linux:"
            echo
            echo '```sh'
            echo "tar -xzf coverwave-*.tar.gz && ./coverwave ~/Music"
            echo '```'
            echo
            echo "macOS marks downloads as quarantined; if it refuses to open, run \`xattr -d com.apple.quarantine coverwave\` once. The first run downloads the cover-analysis model (45 MB)."
            echo
            echo "### For building the iPhone app"
            echo
            echo "\`ios/fetch-core.sh\` downloads these, so Xcode only compiles the Swift app:"
            echo
            echo "| File | What it is | Size |"
            echo "|---|---|---|"
            echo "| CoverwaveCore.xcframework.zip | the shared Rust core for iOS | $(size CoverwaveCore.xcframework.zip) |"
            echo "| CoverwaveCore.swift | its Swift bindings (UniFFI) | $(size CoverwaveCore.swift) |"
            echo "| BeatThis-small.onnx | the Beat This! beat tracker, MIT | $(size BeatThis-small.onnx) |"
            echo
            echo "### Recent changes"
            echo
            git log -10 --pretty='- %s (%h)' "$GITHUB_SHA"
            echo
            echo "Check downloads with \`sha256sum -c SHA256SUMS.txt\`."
          } > notes.md
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}
        run: |
          # Display names on the release page; the file names stay as they
          # are (ios/fetch-core.sh downloads them by name).
          files=(
            "dist/coverwave-macos-arm64.tar.gz#coverwave for macOS (Apple silicon)"
            "dist/coverwave-linux-x64.tar.gz#coverwave for Linux (x86-64)"
            "dist/coverwave-windows-x64.zip#coverwave for Windows (x86-64)"
            "dist/CoverwaveCore.xcframework.zip#iOS core (XCFramework)"
            "dist/CoverwaveCore.swift#iOS core Swift bindings"
            "dist/BeatThis-small.onnx#Beat tracker model (ONNX)"
            "dist/SHA256SUMS.txt#SHA-256 checksums"
            "dist/build-info.txt#Build info (commit and time)"
          )
          if [ "$RELEASE_TAG" = latest-build ]; then
            gh release delete latest-build --yes --cleanup-tag || true
            gh release create latest-build "${files[@]}" \
              --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Latest build (${GITHUB_SHA::7})" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --verify-tag --latest --title "coverwave $RELEASE_TAG" --notes-file notes.md
          fi
