# Build, lint and test on Linux, Windows and macOS.
#
# Runs on pushes and pull requests to main only while the repo is PUBLIC,
# where Actions minutes are free. On a private repo it runs only by hand
# (Actions > CI > Run workflow), because runs then use the account's
# allowance (Windows 2x, macOS 10x; a full run is roughly 150-250 counted
# minutes). The Release workflow publishes binaries and the iOS core.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release -p cw-tui

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: coverwave-${{ runner.os }}
          path: |
            target/release/coverwave
            target/release/coverwave.exe
          if-no-files-found: error
          retention-days: 7
