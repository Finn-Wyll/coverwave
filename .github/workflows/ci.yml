# Build, lint and test on Linux, Windows and macOS.
#
# MANUAL ONLY: it never runs by itself. Start it from GitHub (Actions > CI >
# Run workflow) once the workflow is on the default branch.
#
# Cost: the repo is private, so runs use the account's free Actions
# allowance (Windows minutes count 2x, macOS 10x; one full run is roughly
# 150-250 counted minutes). With GitHub's default $0 spending limit, going
# over the allowance stops runs instead of charging. Check Settings >
# Billing and plans before raising any limit.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release -p cw-tui

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cw-tui-${{ runner.os }}
          path: |
            target/release/cw-tui
            target/release/cw-tui.exe
          if-no-files-found: error
          retention-days: 7
